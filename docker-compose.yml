services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SERVER_PEPPER: ${SERVER_PEPPER}
      APP_ORIGIN: ${APP_ORIGIN}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # The app only listens on 127.0.0.1 behind your reverse proxy, which MUST overwrite
      # X-Forwarded-For with the real client address (see README).
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"
    # Disposable, stateless container: read-only root, only /tmp writable, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

volumes:
  pgdata:
